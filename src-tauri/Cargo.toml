[package]
name = "repressurizer"
version = "0.7.0"
description = "Steam Library Manager"
authors = ["you"]
edition = "2021"
default-run = "repressurizer"

[features]
no-sam = []
sam-sidecar = []
mcp-sidecar = []

[[bin]]
name = "repressurizer-sam"
path = "src/bin/repressurizer-sam.rs"
required-features = ["sam-sidecar"]

[[bin]]
name = "repressurizer-mcp"
path = "src/bin/repressurizer-mcp.rs"
required-features = ["mcp-sidecar"]

[lib]
name = "repressurizer_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
reqwest = { version = "0.13", features = ["json", "query", "socks"] }
subtle = "2"
repressurizer-integration = { path = "../packages/rust" }
tokio = { version = "1", features = ["full"] }
sha2 = "0.11"
base64 = "0.23"
chrono = "0.4"
dirs = "6"
fs2 = "0.4"
rusty-leveldb = "4.0.1"
libloading = "0.9"
roxmltree = "0.21"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
uuid = { version = "1.24", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows-core = "0.61.2"

[dev-dependencies]
wiremock = "0.6"
