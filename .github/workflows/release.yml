name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to rebuild and publish
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: true

env:
  HAS_VT_API_KEY: ${{ secrets.VT_API_KEY != '' }}
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '' }}
  RELEASE_REF: ${{ inputs.release_tag || github.ref }}
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  linux:
    name: Linux AppImage, Debian package, and CLI
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.94.0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate project
        run: bun run check

      - name: Build Linux desktop bundles
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run build:linux

      - name: Build Linux CLI
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --bin repressurizer-cli

      - name: Collect Linux artifacts
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/deb/*.deb artifacts/
          cp src-tauri/target/release/bundle/appimage/*.AppImage artifacts/
          cp src-tauri/target/release/bundle/appimage/*.AppImage.sig artifacts/
          cp src-tauri/target/release/repressurizer-cli artifacts/repressurizer-cli
          tar --create --gzip \
            --file artifacts/Repressurizer-cli-linux-x86_64.tar.gz \
            --directory artifacts repressurizer-cli
          rm artifacts/repressurizer-cli
          find artifacts -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-release-artifacts
          path: artifacts/
          if-no-files-found: error
          retention-days: 1

  macos:
    name: macOS universal DMG and updater
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.94.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Restore caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            ~/.cargo/git
            ~/.cargo/registry
          key: ${{ runner.os }}-macos-release-${{ hashFiles('bun.lock', 'src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-macos-release-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build ad-hoc signed universal bundles
        env:
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run build:macos

      - name: Smoke-test ad-hoc signed app and DMG
        run: |
          set -e
          bundle_dir="src-tauri/target/universal-apple-darwin/release/bundle"
          app_path=$(find "$bundle_dir/macos" -maxdepth 1 -type d -name '*.app' -print -quit)
          dmg_path=$(find "$bundle_dir/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)
          updater_path=$(find "$bundle_dir/macos" -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)
          test -n "$app_path"
          test -n "$dmg_path"
          test -n "$updater_path"
          test -s "$updater_path.sig"
          binary_path="$app_path/Contents/MacOS/repressurizer"
          test -x "$binary_path"
          lipo "$binary_path" -verify_arch x86_64 arm64
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign -dv --verbose=4 "$app_path" 2>&1 | grep -q '^Signature=adhoc$'
          mount_point=$(mktemp -d)
          hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mount_point"
          test -d "$mount_point/Repressurizer.app"
          codesign --verify --deep --strict --verbose=2 "$mount_point/Repressurizer.app"
          hdiutil detach "$mount_point"
          rmdir "$mount_point"

      - name: Collect macOS artifacts
        run: |
          set -e
          bundle_dir="src-tauri/target/universal-apple-darwin/release/bundle"
          mkdir -p artifacts
          cp "$bundle_dir/dmg/"*.dmg artifacts/
          cp "$bundle_dir/macos/"*.app.tar.gz artifacts/
          cp "$bundle_dir/macos/"*.app.tar.gz.sig artifacts/
          find artifacts -maxdepth 1 -type f -exec stat -f '%N %z bytes' {} \; | sort

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-release-artifacts
          path: artifacts/
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Windows installer and portable
    runs-on: windows-2025-vs2026
    needs: [linux, macos]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $channel = bun scripts/release-channel.ts identify --version $version --tag $tag
          $sha = (git rev-parse HEAD).Trim()
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT

      - name: Validate release tag
        shell: pwsh
        run: |
          $releaseTag = "${{ env.RELEASE_TAG }}"
          if ($releaseTag -ne "${{ steps.version.outputs.tag }}") {
            throw "Tag $releaseTag does not match package version ${{ steps.version.outputs.tag }}"
          }
          $tagCommit = (git rev-list -n 1 $releaseTag).Trim()
          $releaseCommit = (git rev-parse HEAD).Trim()
          if ($tagCommit -ne $releaseCommit) {
            throw "Checked out commit $releaseCommit does not match $releaseTag at $tagCommit"
          }

      - name: Verify CI passed for release commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseCommit = (git rev-parse HEAD).Trim()
          $deadline = (Get-Date).AddMinutes(20)

          while ((Get-Date) -lt $deadline) {
            $runs = @(gh run list `
              --repo "${{ github.repository }}" `
              --workflow ci.yml `
              --commit "$releaseCommit" `
              --limit 20 `
              --json status,conclusion | ConvertFrom-Json)

            $successfulRuns = @($runs | Where-Object { $_.conclusion -eq "success" })
            if ($successfulRuns.Count -gt 0) {
              Write-Host "Found a successful CI run for release commit $releaseCommit"
              exit 0
            }

            $running = @($runs | Where-Object { $_.status -ne "completed" })
            if ($runs.Count -gt 0 -and $running.Count -eq 0) {
              $conclusions = ($runs | ForEach-Object { $_.conclusion }) -join ", "
              throw "All CI runs for release commit $releaseCommit completed without success: $conclusions"
            }

            Write-Host "Waiting for CI to finish for release commit $releaseCommit"
            Start-Sleep -Seconds 15
          }

          throw "Timed out waiting for a successful CI run for release commit $releaseCommit"

      - name: Restore Bun cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.94.0

      - name: Install NSIS
        run: choco install nsis --version=3.11 -y --no-progress

      - name: Restore Rust cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: ${{ runner.os }}-windows-release-rust-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-windows-release-rust-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate changelog
        run: bun run changelog:write

      - name: Typecheck
        run: bun run check

      - name: Build Windows bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun tauri build

      - name: Build Windows CLI
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --bin repressurizer-cli

      - name: Download Linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-release-artifacts
          path: artifacts

      - name: Download macOS artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-release-artifacts
          path: artifacts

      - name: Collect Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          Copy-Item src-tauri\target\release\repressurizer.exe artifacts\Repressurizer-portable.exe
          Set-Content -Path artifacts\repressurizer-portable.marker -Value "portable"
          Compress-Archive -Path artifacts\Repressurizer-portable.exe, artifacts\repressurizer-portable.marker -DestinationPath artifacts\Repressurizer-portable-windows-x64.zip -Force
          Remove-Item artifacts\repressurizer-portable.marker
          Copy-Item src-tauri\target\release\repressurizer-cli.exe artifacts\Repressurizer-cli.exe
          Compress-Archive -Path artifacts\Repressurizer-cli.exe -DestinationPath artifacts\Repressurizer-cli-windows-x64.zip -Force
          Copy-Item src-tauri\target\release\bundle\nsis\*.exe artifacts\
          Copy-Item src-tauri\target\release\bundle\nsis\*.sig artifacts\
          Get-ChildItem artifacts | ForEach-Object { "$($_.Name) $($_.Length) bytes" }

      - name: Create updater manifest
        shell: pwsh
        run: |
          $installer = Get-ChildItem artifacts -Filter "Repressurizer_*_x64-setup.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Could not find NSIS installer"
          }

          $signaturePath = "$($installer.FullName).sig"
          if (-not (Test-Path $signaturePath)) {
            throw "Could not find updater signature for $($installer.Name)"
          }

          $assetUrl = "https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/$($installer.Name)"
          $manifest = [ordered]@{
            version = "${{ steps.version.outputs.version }}"
            notes = "Modern Steam library management, inspired by Depressurizer."
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content $signaturePath -Raw).Trim()
                url = $assetUrl
              }
            }
          }

          $linuxUpdater = Get-ChildItem artifacts -Filter "*.AppImage" | Select-Object -First 1
          if (-not $linuxUpdater) {
            throw "Could not find Linux AppImage updater bundle"
          }
          $linuxSignaturePath = "$($linuxUpdater.FullName).sig"
          if (-not (Test-Path $linuxSignaturePath)) {
            throw "Could not find updater signature for $($linuxUpdater.Name)"
          }
          $linuxAssetName = [System.Uri]::EscapeDataString($linuxUpdater.Name)
          $manifest.platforms["linux-x86_64"] = [ordered]@{
            signature = (Get-Content $linuxSignaturePath -Raw).Trim()
            url = "https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/$linuxAssetName"
          }

          $macUpdater = Get-ChildItem artifacts -Filter "*.app.tar.gz" | Select-Object -First 1
          if (-not $macUpdater) {
            throw "Could not find macOS updater bundle"
          }
          $macSignaturePath = "$($macUpdater.FullName).sig"
          if (-not (Test-Path $macSignaturePath)) {
            throw "Could not find updater signature for $($macUpdater.Name)"
          }
          $macAssetName = [System.Uri]::EscapeDataString($macUpdater.Name)
          $macUpdaterEntry = [ordered]@{
            signature = (Get-Content $macSignaturePath -Raw).Trim()
            url = "https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/$macAssetName"
          }
          $manifest.platforms["darwin-aarch64"] = $macUpdaterEntry
          $manifest.platforms["darwin-x86_64"] = $macUpdaterEntry

          $manifest | ConvertTo-Json -Depth 8 | Set-Content -Path artifacts\latest.json -Encoding utf8

      - name: Create channel-specific updater manifests
        run: bun scripts/release-channel.ts manifests --manifest artifacts/latest.json --out artifacts --channel "${{ steps.version.outputs.channel }}"

      - name: Validate updater manifest
        shell: pwsh
        run: |
          $channel = "${{ steps.version.outputs.channel }}"
          $common = @("--artifacts", "artifacts", "--repo", "${{ github.repository }}", "--tag", "${{ env.RELEASE_TAG }}", "--version", "${{ steps.version.outputs.version }}")
          bun scripts/updater-manifest.ts --manifest artifacts/latest.json @common --platform windows-x86_64 --platform linux-x86_64 --platform darwin-aarch64 --platform darwin-x86_64
          foreach ($target in @("windows-x86_64", "linux-x86_64", "darwin-aarch64", "darwin-x86_64")) {
            $channelTarget = "$target-$channel"
            bun scripts/updater-manifest.ts --manifest "artifacts/$channelTarget.json" @common --channel $channel --platform $channelTarget
          }

      - name: Create artifact checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem artifacts -File |
            Where-Object { $_.Name -ne "SHA256SUMS.txt" } |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          Set-Content -Path artifacts\SHA256SUMS.txt -Value $lines -Encoding utf8

      - name: Create release notes
        id: notes
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release-notes.ts --repo "${{ github.repository }}" --tag "${{ env.RELEASE_TAG }}" --sha "${{ steps.version.outputs.sha }}" --out release-notes.md

      - name: VirusTotal Scan
        id: vt-scan
        if: env.IS_RELEASE == 'true' && env.HAS_VT_API_KEY == 'true'
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          request_rate: 4
          files: |
            artifacts/*.exe

      - name: Check VirusTotal verdicts
        id: vt-verdict
        if: env.IS_RELEASE == 'true' && steps.vt-scan.outputs.analysis != ''
        shell: pwsh
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          VT_ANALYSIS: ${{ steps.vt-scan.outputs.analysis }}
        run: |
          $ErrorActionPreference = "Stop"

          function Get-Stat($stats, $name) {
            $property = $stats.PSObject.Properties[$name]
            if ($null -eq $property -or $null -eq $property.Value) {
              return 0
            }
            return [int]$property.Value
          }

          function Get-Detections($results) {
            if ($null -eq $results) {
              return @()
            }

            $detections = @()
            foreach ($result in $results.PSObject.Properties) {
              $category = $result.Value.category
              if ($category -eq "malicious" -or $category -eq "suspicious") {
                $engine = $result.Value.engine_name
                if (-not $engine) {
                  $engine = $result.Name
                }
                $verdict = $result.Value.result
                if (-not $verdict) {
                  $verdict = $category
                }
                $detections += "${engine}: ${verdict}"
              }
            }
            return $detections
          }

          $headers = @{ "x-apikey" = $env:VT_API_KEY }
          $entries = $env:VT_ANALYSIS -split "," | Where-Object { $_ -match "=" }
          $lines = @()
          $detections = @()
          $scanIncomplete = $false
          $maxDetections = 0

          foreach ($entry in $entries) {
            $parts = $entry -split "=", 2
            $name = Split-Path $parts[0] -Leaf
            $url = $parts[1]

            if ($url -notmatch "/file-analysis/([^/]+)/") {
              $lines += "- ${name}: unable to parse VirusTotal analysis link - $url"
              $scanIncomplete = $true
              continue
            }

            $analysisId = $Matches[1]
            $attributes = $null

            for ($attempt = 1; $attempt -le 18; $attempt++) {
              $response = Invoke-RestMethod `
                -Headers $headers `
                -Uri "https://www.virustotal.com/api/v3/analyses/$analysisId"

              $attributes = $response.data.attributes
              if ($attributes.status -eq "completed") {
                break
              }

              Start-Sleep -Seconds 10
            }

            if ($null -eq $attributes -or $attributes.status -ne "completed") {
              $lines += "- ${name}: analysis still pending after timeout - $url"
              $scanIncomplete = $true
              continue
            }

            $stats = $attributes.stats
            $malicious = Get-Stat $stats "malicious"
            $suspicious = Get-Stat $stats "suspicious"
            $harmless = Get-Stat $stats "harmless"
            $undetected = Get-Stat $stats "undetected"
            $timeout = Get-Stat $stats "timeout"
            $engines = Get-Detections $attributes.results
            $engineText = ""
            if ($engines.Count -gt 0) {
              $engineText = " detections: " + ($engines -join "; ")
            }

            $lines += "- ${name}: ${malicious} malicious, ${suspicious} suspicious, ${harmless} harmless, ${undetected} undetected, ${timeout} timeout.${engineText} - $url"

            $detectionCount = $malicious + $suspicious
            if ($detectionCount -gt $maxDetections) {
              $maxDetections = $detectionCount
            }
            if ($detectionCount -gt 0) {
              $detections += "${name}: ${malicious} malicious, ${suspicious} suspicious.${engineText}"
            }
          }

          $markdown = $lines -join "`n"
          $delimiter = [guid]::NewGuid().ToString()
          "markdown<<$delimiter" >> $env:GITHUB_OUTPUT
          $markdown >> $env:GITHUB_OUTPUT
          "$delimiter" >> $env:GITHUB_OUTPUT
          "scan_incomplete=$($scanIncomplete.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "max_detections=$maxDetections" >> $env:GITHUB_OUTPUT

          if ($detections.Count -gt 0) {
            $message = $detections -join "; "
            Write-Output "::warning::VirusTotal reported detections: $message"
          }

      - name: Enforce VirusTotal release policy
        id: release-policy
        if: env.IS_RELEASE == 'true'
        shell: pwsh
        run: |
          $virusTotalEnabled = "${{ env.HAS_VT_API_KEY }}" -eq "true"
          $hasAnalysis = "${{ steps.vt-scan.outputs.analysis }}" -ne ""
          $scanIncomplete = "${{ steps.vt-verdict.outputs.scan_incomplete }}" -eq "true"
          $maxDetections = [int]"0${{ steps.vt-verdict.outputs.max_detections }}"

          if ($virusTotalEnabled -and (-not $hasAnalysis -or $scanIncomplete)) {
            throw "VirusTotal did not produce a completed result for every binary; release will not be published."
          }

          if ($virusTotalEnabled -and $maxDetections -ge 3) {
            throw "VirusTotal reported $maxDetections detections for at least one binary; release will not be published."
          }

          "draft=false" >> $env:GITHUB_OUTPUT

      - name: Append VirusTotal results
        if: env.IS_RELEASE == 'true' && steps.vt-scan.outputs.analysis != ''
        shell: pwsh
        env:
          VT_ANALYSIS: ${{ steps.vt-scan.outputs.analysis }}
          VT_VERDICTS: ${{ steps.vt-verdict.outputs.markdown }}
        run: |
          $lines = "- " + ($env:VT_ANALYSIS -replace "artifacts/", "" -replace "=h", ": h" -replace ",", "`n- ")
          Add-Content -Path release-notes.md -Value "`n## VirusTotal`n`n$lines`n"
          if ($env:VT_VERDICTS) {
            Add-Content -Path release-notes.md -Value "`n### Verdicts`n`n$env:VT_VERDICTS`n"
          }

      - name: Publish GitHub release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Repressurizer ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          files: artifacts/*
          fail_on_unmatched_files: true
          draft: ${{ steps.release-policy.outputs.draft }}
          prerelease: ${{ steps.version.outputs.channel == 'beta' }}
          make_latest: ${{ steps.version.outputs.channel == 'stable' }}

      - name: Publish isolated updater channel manifests
        if: env.IS_RELEASE == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $registryTag = "updater-manifests"
          gh release view $registryTag *> $null
          if ($LASTEXITCODE -ne 0) {
            $global:LASTEXITCODE = 0
            gh release create $registryTag `
              --target "${{ github.event.repository.default_branch }}" `
              --title "Repressurizer updater channel manifests" `
              --notes "Machine-readable signed updater manifests. Use the normal versioned releases for downloads and release notes." `
              --prerelease `
              --latest=false
          }

          $channel = "${{ steps.version.outputs.channel }}"
          $manifests = Get-ChildItem artifacts -Filter "*-$channel.json"
          if ($manifests.Count -ne 4) {
            throw "Expected 4 $channel channel manifests, found $($manifests.Count)"
          }
          foreach ($manifest in $manifests) {
            gh release upload $registryTag $manifest.FullName --clobber
          }
