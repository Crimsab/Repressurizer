name: Security

on:
  pull_request:
    paths:
      - bun.lock
      - package.json
      - "**/Cargo.lock"
      - "**/Cargo.toml"
      - .github/workflows/security.yml
  schedule:
    - cron: "30 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bun-audit:
    name: Bun audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit

  rust-audit:
    name: Rust audit (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: desktop
            directory: src-tauri
          - crate: integration
            directory: packages/rust

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Resolve integration dependencies
        if: matrix.crate == 'integration'
        run: cargo generate-lockfile --manifest-path packages/rust/Cargo.toml

      - name: Audit dependencies
        # rustsec/audit-check fails with "Not Found" while publishing warnings (rustsec/audit-check#56).
        # cargo audit still fails on vulnerabilities and prints unmaintained-crate warnings.
        working-directory: ${{ matrix.directory }}
        run: cargo audit
