name: Apply and test performance audit

on:
  push:
    branches: [fix/performance-audit-2026-09-06]
    paths: ['.audit/**', '.github/workflows/apply-performance-audit.yml']

permissions:
  contents: read

concurrency:
  group: performance-audit-materialization
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == 'Crimsab/Repressurizer' && github.ref == 'refs/heads/fix/performance-audit-2026-09-06'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - name: Verify and apply exact source edits
        run: |
          set -eu
          git merge-base --is-ancestor 5400e5a64a5edde930acbabdc2321bf2972176fc HEAD
          python - <<'PY'
          import base64, hashlib, io, pathlib, shutil, subprocess, tempfile, zipfile
          text = ''.join(pathlib.Path(f'.audit/payload-{i}.b64').read_text() for i in range(4))
          # Correct one identified transport character before verifying the complete archive.
          text = text.replace('XwANPCGGv31', 'XwANPCGv31')
          payload = base64.b64decode(text, validate=True)
          assert hashlib.sha256(payload).hexdigest() == '74afe0a3177e99844dd14259b83b35e8531e77478cfb869a36f315e4eb1ef43f', 'Source payload checksum mismatch'
          with tempfile.TemporaryDirectory() as temp:
              root = pathlib.Path(temp)
              with zipfile.ZipFile(io.BytesIO(payload)) as archive:
                  for name in archive.namelist():
                      path = pathlib.PurePosixPath(name)
                      assert not path.is_absolute() and '..' not in path.parts
                      assert name == 'edits.py' or name.startswith(('new/src/', 'new/tests/'))
                  archive.extractall(root)
              subprocess.run(['python', str(root / 'edits.py')], check=True)
              for source in (root / 'new').rglob('*'):
                  if source.is_file():
                      target = pathlib.Path(source.relative_to(root / 'new'))
                      assert not target.exists(), f'New file already exists: {target}'
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copyfile(source, target)
          PY
          bun scripts/i18n-status.ts --write
          git diff --check
      - name: Commit only to the audit branch
        id: commit
        run: |
          set -eu
          rm -rf .audit
          rm .github/workflows/apply-performance-audit.yml
          git add src tests vite.config.ts docs/localization.md .audit .github/workflows/apply-performance-audit.yml
          git diff --cached --stat
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: preserve drafts, virtualize large libraries and serialize persistence'
          git push origin HEAD:refs/heads/fix/performance-audit-2026-09-06
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  web-validation:
    needs: materialize
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.materialize.outputs.commit }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run check
      - name: Unit regression suite
        if: always()
        run: bun run test:unit
      - name: Release frontend build
        if: always()
        run: bun run build
      - name: Install browser
        if: always()
        run: bunx playwright install --with-deps chromium
      - name: Browser regression suite
        if: always()
        run: bun run test:e2e
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: performance-audit-browser-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
